<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>JetFlow - Choose Password</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div id="auth-message" class="auth-message" role="alert" aria-live="assertive"></div>
  <div class="auth-shell">
    <div class="auth-panel">
      <div class="brand-block">
        <div class="brand-mark">J</div>
        <div><p class="eyebrow">Account recovery</p><h1>JetFlow</h1></div>
      </div>
      <form id="reset-password-form" class="auth-form">
        <div class="form-heading">
          <h2>Choose a new password</h2>
          <p>Use a strong password you have not used elsewhere.</p>
        </div>
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" maxlength="128" required>
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" maxlength="128" required>
        <button type="submit">Update password</button>
        <p class="auth-link"><a href="index.html">Back to login</a></p>
      </form>
    </div>
  </div>
  <script src="auth-feedback.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
