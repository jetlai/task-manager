<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>JetFlow - Login</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div id="auth-message" class="auth-message" role="alert" aria-live="assertive"></div>
  <div class="auth-shell">
    <div class="auth-panel">
      <div class="brand-block">
        <div class="brand-mark">J</div>
        <div>
          <p class="eyebrow">Productivity</p>
          <h1>JetFlow</h1>
        </div>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-heading">
          <h2>Welcome back</h2>
          <p>Sign in to continue managing your work.</p>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" maxlength="254" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required>

        <button type="submit">Log in</button>
        <a class="forgot-link" href="reset-request.html">Forgot password?</a>
        <p class="auth-link">Need an account? <a href="register.html">Create one</a></p>
      </form>
    </div>
  </div>
<script src="auth-feedback.js"></script>
<script src="login.js"></script>
</body>
</html>
